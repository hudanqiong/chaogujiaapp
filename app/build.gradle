plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.chaogujia.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.chaogujia.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        debug {
            // 固定签名：保证每次 CI 构建签名一致，可直接覆盖安装（升级），登录态保留
            def ksFile = rootProject.file('app/cgj-fixed-debug.keystore')
            if (ksFile.exists()) {
                signingConfigs {
                    fixedDebug {
                        storeFile ksFile
                        storePassword 'cgjfixed123'
                        keyAlias 'cgjdebug'
                        keyPassword 'cgjfixed123'
                    }
                }
                signingConfig signingConfigs.fixedDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}