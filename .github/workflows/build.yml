name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Ensure fixed debug keystore
        run: |
          if [ ! -f app/cgj-fixed-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/cgj-fixed-debug.keystore \
              -alias cgjdebug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cgjfixed123 -keypass cgjfixed123 \
              -dname "CN=Chaogujia Debug, OU=Dev, O=Chaogujia, L=City, ST=State, C=CN"
            echo "NOTE: keystore generated fresh in this run."
          else
            echo "NOTE: using existing keystore from repo."
          fi
          keytool -list -keystore app/cgj-fixed-debug.keystore -storepass cgjfixed123 | head -5
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace > full_build_log.txt 2>&1 || (cat full_build_log.txt; exit 1)
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: full_build_log.txt
          if-no-files-found: warn
      - name: Upload fixed keystore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-keystore
          path: app/cgj-fixed-debug.keystore
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chaogujia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
